name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check syntax validity
        run: |
          python -m py_compile scripts/parse_session.py
          python -m py_compile scripts/sync.py
          python -m py_compile scripts/setup.py

      - name: Run parse smoke test
        run: |
          echo 'Implemented a FastAPI endpoint for user auth. Fixed a Docker build issue by adding pydantic to requirements.txt.' | python scripts/parse_session.py

      - name: Run sync dry-run smoke test
        run: |
          echo 'Implemented a FastAPI endpoint for user auth.' | python scripts/parse_session.py --output /tmp/test.json
          python scripts/sync.py --input /tmp/test.json --dry-run
